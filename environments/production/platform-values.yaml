# yaml-language-server: $schema=../../schemas/platform-values/v1.schema.json
#
# Production-shaped install of the core profile. Copy this directory, give the
# environment your own name, and replace every value marked REPLACE. The
# addresses below are documentation ranges (RFC 5737) and do not work as-is.
#
# Before installing, the operator provides (see docs/install-order.md):
#   - a PostgreSQL 16 database and the Secret named in database.secret;
#   - the database CA named in database.tls.ca;
#   - the cert-manager issuer named in tls.certManager.issuer.ref.
apiVersion: steward-platform/v1
kind: PlatformValues
environment: production
purpose: production
profile: core

cluster:
  domain: cluster.local
  # REPLACE: the issuer from
  #   kubectl get --raw /.well-known/openid-configuration
  serviceAccountTokenAudience: https://kubernetes.default.svc
  dnsNamespace: kube-system
  kubeApi:
    # REPLACE: the Kubernetes API address and port your CNI matches for pod
    # egress and for webhook calls from the API server. See
    # docs/prerequisites.md#networkpolicy.
    cidrs: [192.0.2.10/32]
    port: 443

namespaces:
  steward: steward
  certManager: cert-manager

serviceAccounts:
  steward:
    apiserver:
      annotations: {}
    controller:
      annotations: {}

tls:
  mode: certManager
  certManager:
    # Set false if the cluster already runs cert-manager.
    install: true
    issuer:
      source: operator
      ref:
        # REPLACE: an existing Issuer (in the Steward namespace) or
        # ClusterIssuer that your PKI approves for service certificates.
        name: example-ca
        kind: ClusterIssuer

database:
  source: operator
  # Create this Secret before installing. Its value is the full database URL,
  # with sslmode=verify-full&sslrootcert=/run/database-tls/ca.crt.
  secret:
    name: steward-database
    key: url
  # REPLACE: the literal address of the database.
  cidrs: [198.51.100.20/32]
  port: 5432
  tls:
    mode: verify-full
    ca:
      kind: ConfigMap
      name: steward-database-ca
      key: ca.crt

networkPolicy:
  apiserverIngressNamespaces: []
