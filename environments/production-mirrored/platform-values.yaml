# yaml-language-server: $schema=../../schemas/platform-values/v1.schema.json
#
# Production-shaped install of the task-auth profile from a private registry
# mirror: the production-task-auth environment plus the registry block at the
# end. Every chart, image and CRD source comes from the mirror, pinned by the
# same BOM digests. The mirror hosts are placeholders under example.test and do
# not resolve. examples/flux/mirrored is the Flux output for this file; see
# docs/registry-mirroring.md for copying the artifacts into the mirror
# (scripts/mirror-list.sh) and checking them (scripts/verify-digests.sh
# --mirror).
#
# Before installing, the operator provides everything production-task-auth
# lists (../production-task-auth/platform-values.yaml), and:
#   - the artifacts, copied into the mirror;
#   - the image pull Secret named in registry.imagePullSecrets, in the steward,
#     cert-manager, identity and envoy-gateway-system namespaces;
#   - for Flux, the Secrets named in registry.*.flux, in flux-system.
apiVersion: steward-platform/v1
kind: PlatformValues
environment: production-mirrored
purpose: production
profile: task-auth

cluster:
  domain: cluster.local
  # REPLACE: the issuer from
  #   kubectl get --raw /.well-known/openid-configuration
  serviceAccountTokenAudience: https://kubernetes.default.svc
  dnsNamespace: kube-system
  kubeApi:
    # REPLACE: the Kubernetes API address and port your CNI matches. See
    # docs/prerequisites.md#networkpolicy.
    cidrs: [192.0.2.10/32]
    port: 443

namespaces:
  steward: steward
  certManager: cert-manager
  identityExchange: identity

serviceAccounts:
  steward:
    apiserver:
      annotations: {}
    controller:
      annotations: {}
  identityExchange:
    annotations: {}

tls:
  mode: certManager
  certManager:
    # Set false if the cluster already runs cert-manager.
    install: true
    issuer:
      source: operator
      ref:
        # REPLACE: an existing Issuer (in the Steward namespace) or
        # ClusterIssuer that your PKI approves for service certificates.
        name: example-ca
        kind: ClusterIssuer

database:
  source: operator
  # Create this Secret before installing. Its value is the full database URL,
  # with sslmode=verify-full&sslrootcert=/run/database-tls/ca.crt.
  secret:
    name: steward-database
    key: url
  # REPLACE: the literal address of the database.
  cidrs: [198.51.100.20/32]
  port: 5432
  tls:
    mode: verify-full
    ca:
      kind: ConfigMap
      name: steward-database-ca
      key: ca.crt

networkPolicy:
  apiserverIngressNamespaces: []
  # Envoy Gateway runs its Envoy proxies in its own namespace.
  edgeNamespace: envoy-gateway-system

publicEndpoints:
  # REPLACE: your public Steward origin and exchange issuer.
  steward: https://steward.example.com
  identityIssuer: https://identity.example.com

audiences:
  taskApi: steward-task-api

edge:
  # The BOM-pinned Gateway API CRDs and Envoy Gateway. Set false if the
  # cluster already runs a Gateway API implementation with BackendTLSPolicy.
  install: true
  gateway:
    source: operator
    # REPLACE: your Gateway and its HTTPS listener.
    name: steward-edge
    namespace: envoy-gateway-system
    listener: https
  # REPLACE: the source addresses of your edge data plane.
  clientCidrs: [203.0.113.0/24]
  stewardBackendCaConfigMap: steward-apiserver-ca

identityExchange:
  # REPLACE: the audience your workflows request from GitHub.
  githubAudience: steward-platform-task-auth
  policy:
    contract: github-oidc-exchange.apelogic.io/v6
    configMapName: github-oidc-exchange-policy-v6
    revision: v6-rev-1
  keyring:
    secretName: github-oidc-exchange-keyring
    revision: rev-1
  publicJwksConfigMap:
    name: github-oidc-exchange-jwks
    key: jwks.json

registry:
  # REPLACE: your mirror. Each class that is set is pulled from its mirror;
  # the digests stay the BOM's. Product artifacts drop the upstream registry
  # (ghcr.io/apelogic-ai/steward becomes
  # registry.example.test/steward-platform/apelogic-ai/steward); dependency
  # artifacts keep it as a path segment, because they come from several
  # upstream registries (quay.io, docker.io).
  productImages:
    prefix: registry.example.test/steward-platform
  productCharts:
    prefix: registry.example.test/steward-platform
    flux:
      secretRef:
        name: registry-example-test
  dependencyImages:
    prefix: registry.example.test/steward-platform
    keepSourceHost: true
  dependencyCharts:
    prefix: registry.example.test/steward-platform
    keepSourceHost: true
    flux:
      # A cloud registry can use the source controller's workload identity
      # instead of a Secret, for example provider: aws.
      secretRef:
        name: registry-example-test
  # The Gateway API CRDs and charts/steward-edge, for Flux.
  gitSources:
    prefix: https://git.example.test/mirrors
    keepSourceHost: true
    flux:
      secretRef:
        name: git-example-test
  # The CRD manifests the helmfile applies.
  manifests:
    prefix: https://files.example.test/mirrors
    keepSourceHost: true
  # A kubernetes.io/dockerconfigjson Secret for registry.example.test, in
  # every namespace a chart installs into. Never credentials in this file.
  imagePullSecrets: [registry-example-test]
