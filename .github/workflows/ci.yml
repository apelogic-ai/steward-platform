name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

  validate:
    name: validate BOM
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install check-jsonschema
        run: pipx install check-jsonschema==0.38.2
      - name: Validate
        run: scripts/validate-bom.sh

  generate:
    name: generator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The platform release tags, for the backward compatibility checks.
          fetch-depth: 0
      - name: Install check-jsonschema
        run: pipx install check-jsonschema==0.38.2
      - name: Install tools
        run: scripts/ci/install-tools.sh helm helmfile yq
      - name: Validate the platform values schema
        run: check-jsonschema --check-metaschema schemas/platform-values/v1.schema.json
      - name: Test the generator and helmfile against the pinned charts
        run: tests/generate/run.sh

  hooks:
    name: helmfile hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install check-jsonschema
        run: pipx install check-jsonschema==0.38.2
      - name: Install tools
        run: scripts/ci/install-tools.sh helmfile yq
      - name: Check the CRD hook writes only to the releases' kube context
        run: tests/hooks/run.sh

  built:
    name: built artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install check-jsonschema
        run: pipx install check-jsonschema==0.38.2
      - name: Install tools
        run: scripts/ci/install-tools.sh yq
      - name: Validate the built-artifacts lock schema
        run: check-jsonschema --check-metaschema schemas/built-lock/v1.schema.json
      - name: Check the example lock against the BOM
        run: scripts/verify-built-lock.sh --offline --profile browser-admin examples/built/built-lock.json
      # Generates every environment in built mode with the example lock
      # (substitution), refuses locks with missing entries, and checks that
      # BOM mode is unchanged by the artifacts block.
      - name: Test built mode with the example lock
        run: tests/built/run.sh

  flux:
    name: Flux examples
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install check-jsonschema
        run: pipx install check-jsonschema==0.38.2
      - name: Install tools
        run: scripts/ci/install-tools.sh helm helmfile kubeconform flux-schemas yq
      - name: Check the Flux examples against the BOM, the helmfile and the Flux schemas
        run: tests/flux/run.sh

  flux-reconcile:
    name: Flux reconcile (task-auth edge)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        run: scripts/ci/install-tools.sh kind kubectl yq flux-install
      - name: Reconcile the task-auth CRD sources, Envoy Gateway and steward-edge with Flux
        run: tests/flux/reconcile.sh

  digests:
    name: verify digests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        run: scripts/ci/install-tools.sh crane
      - name: Verify every digest resolves anonymously
        run: scripts/verify-digests.sh

  attestations:
    name: verify attestations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify product attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-attestations.sh

  signatures:
    name: verify signatures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        run: scripts/ci/install-tools.sh cosign
      - name: Verify product cosign bundles
        run: scripts/verify-signatures.sh

  e2e-plan:
    name: plan e2e matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
      core: ${{ steps.versions.outputs.core }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # core runs the default PostgreSQL version on every tested Kubernetes
      # version, and each other tested PostgreSQL version on the highest one:
      # the database version and the Kubernetes version are independent axes
      # (Steward reaches PostgreSQL over TCP; admission, cert-manager and
      # NetworkPolicy do not depend on the database version). The default
      # entries install the kind environment unchanged (no override). One more
      # entry, on the highest Kubernetes version, installs the same from a
      # local registry mirror (tests/e2e/core/run.sh, MIRROR=1).
      - name: Read tested Kubernetes and PostgreSQL versions from the BOM
        id: versions
        run: |
          echo "versions=$(jq -c '[.kubernetes.tested[].version]' bom/bom.json)" >> "${GITHUB_OUTPUT}"
          echo "core=$(jq -c '
            (.kubernetes.tested | map(.version)) as $k8s
            | ($k8s | max_by(split(".") | map(tonumber))) as $highest
            | .dependencies.postgresql as $pg
            | [$k8s[] | {k8s: ., postgres: $pg.version, override: "", mirror: false}]
              + [$pg.tested[].version | select(. != $pg.version) | {k8s: $highest, postgres: ., override: ., mirror: false}]
              + [{k8s: $highest, postgres: $pg.version, override: "", mirror: true}]
          ' bom/bom.json)" >> "${GITHUB_OUTPUT}"

  e2e-core:
    name: core e2e (Kubernetes ${{ matrix.k8s }}, PostgreSQL ${{ matrix.postgres }}${{ matrix.mirror && ', registry mirror' || '' }})
    needs: [validate, e2e-plan]
    # Steward images are linux/amd64 only; ubuntu-latest is amd64.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.e2e-plan.outputs.core) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install check-jsonschema
        run: pipx install check-jsonschema==0.38.2
      - name: Install tools
        run: scripts/ci/install-tools.sh kind helm helmfile kubectl yq crane
      - name: Run core e2e through the reference install
        env:
          K8S_VERSION: ${{ matrix.k8s }}
          POSTGRES_VERSION: ${{ matrix.override }}
          MIRROR: ${{ matrix.mirror && '1' || '0' }}
        run: tests/e2e/core/run.sh

  e2e-browser-admin:
    name: browser-admin e2e (Kubernetes ${{ matrix.k8s }})
    needs: [validate, e2e-plan]
    # Steward images are linux/amd64 only; ubuntu-latest is amd64.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        k8s: ${{ fromJSON(needs.e2e-plan.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read pins from the BOM
        id: bom
        run: echo "identity-commit=$(jq -er '.products["github-oidc-exchange"].commit' bom/bom.json)" >> "${GITHUB_OUTPUT}"
      - name: Install check-jsonschema
        run: pipx install check-jsonschema==0.38.2
      - name: Install tools
        run: scripts/ci/install-tools.sh kind helm helmfile kubectl yq
      # The same cache as the task-auth job: keyring-tool at the BOM commit.
      - name: Restore keyring-tool
        id: keyring-tool
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/keyring-tool
          key: keyring-tool-${{ steps.bom.outputs.identity-commit }}-${{ runner.os }}-${{ runner.arch }}
      - name: Build keyring-tool from the github-oidc-exchange source at the BOM commit
        if: steps.keyring-tool.outputs.cache-hit != 'true'
        run: scripts/ci/build-keyring-tool.sh "${RUNNER_TEMP}/keyring-tool/keyring-tool"
      - name: Run browser-admin e2e through the reference install
        env:
          K8S_VERSION: ${{ matrix.k8s }}
          KEYRING_TOOL: ${{ runner.temp }}/keyring-tool/keyring-tool
        run: tests/e2e/browser-admin/run.sh

  e2e-task-auth:
    name: task-auth e2e (Kubernetes ${{ matrix.k8s }})
    needs: [validate, e2e-plan]
    # Steward images are linux/amd64 only; ubuntu-latest is amd64.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # A real GitHub Actions OIDC token is the input under test.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        k8s: ${{ fromJSON(needs.e2e-plan.outputs.versions) }}
    steps:
      - name: Check for a GitHub OIDC token
        id: oidc
        run: |
          if [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" && -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice title=task-auth e2e skipped::No GitHub Actions OIDC token is available to this job (pull requests from forks cannot request one). The core e2e still runs."
            echo "available=false" >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.oidc.outputs.available == 'true'
        with:
          persist-credentials: false
      - name: Read pins from the BOM
        if: steps.oidc.outputs.available == 'true'
        id: bom
        run: |
          echo "identity-commit=$(jq -er '.products["github-oidc-exchange"].commit' bom/bom.json)" >> "${GITHUB_OUTPUT}"
          echo "runner-node=$(node --version 2>/dev/null || echo none)" >> "${GITHUB_OUTPUT}"
      # The steward-run action runs `node` from PATH and needs Node 24
      # (apelogic-ai/steward-run#69); the runner image's default Node is
      # reported, then replaced by a pinned Node 24.
      - name: Report the runner's default Node
        if: steps.oidc.outputs.available == 'true'
        run: echo "::notice title=Runner default Node::${{ steps.bom.outputs.runner-node }}; the steward-run action needs Node 24, so this job sets it up explicitly."
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.oidc.outputs.available == 'true'
        with:
          node-version: 24.21.0
      - name: Install check-jsonschema
        if: steps.oidc.outputs.available == 'true'
        run: pipx install check-jsonschema==0.38.2
      - name: Install tools
        if: steps.oidc.outputs.available == 'true'
        run: scripts/ci/install-tools.sh kind helm helmfile kubectl yq
      - name: Restore keyring-tool
        if: steps.oidc.outputs.available == 'true'
        id: keyring-tool
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/keyring-tool
          key: keyring-tool-${{ steps.bom.outputs.identity-commit }}-${{ runner.os }}-${{ runner.arch }}
      - name: Build keyring-tool from the github-oidc-exchange source at the BOM commit
        if: steps.oidc.outputs.available == 'true' && steps.keyring-tool.outputs.cache-hit != 'true'
        run: scripts/ci/build-keyring-tool.sh "${RUNNER_TEMP}/keyring-tool/keyring-tool"
      - name: Install the task-auth profile and check the edge
        if: steps.oidc.outputs.available == 'true'
        id: up
        env:
          K8S_VERSION: ${{ matrix.k8s }}
          KEYRING_TOOL: ${{ runner.temp }}/keyring-tool/keyring-tool
        run: tests/e2e/task-auth/run.sh up
      # Check out the released action at the BOM's action commit (from the
      # signed release manifest) and run it by path, so that a steward-run
      # bump is a BOM edit. The code that runs is the action at that commit.
      - name: Check out the steward-run action at the BOM action commit
        if: steps.up.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: apelogic-ai/steward-run
          ref: ${{ steps.up.outputs.action-commit }}
          path: .task-auth/steward-run
          persist-credentials: false
      - name: Check the runner Node against the action's engines
        if: steps.up.outcome == 'success'
        run: tests/e2e/task-auth/run.sh check-node .task-auth/steward-run
      - name: Run the steward-run action against Steward through the edge
        if: steps.up.outcome == 'success'
        id: steward-run
        # Steward refuses the submission (the subject is not associated with a
        # Steward user); verify asserts exactly that.
        continue-on-error: true
        uses: ./.task-auth/steward-run
        env:
          # steward-run's documented private-CA trust: extends Node's roots.
          NODE_EXTRA_CA_CERTS: ${{ steps.up.outputs.edge-ca-file }}
        with:
          workflow: task-auth-probe@1
          inputs: task-auth-probe/request.txt
          outputs: task-auth-probe/out/result.txt
          steward-api-url: ${{ steps.up.outputs.steward-api-url }}
      - name: Verify the authentication chain and the negative cases
        if: steps.up.outcome == 'success'
        env:
          STEWARD_RUN_OUTCOME: ${{ steps.steward-run.outcome }}
          STEWARD_RUN_ACTION_PATH: .task-auth/steward-run
        run: tests/e2e/task-auth/run.sh verify
      - name: Remove the cluster
        if: always() && steps.oidc.outputs.available == 'true'
        run: tests/e2e/task-auth/run.sh down
