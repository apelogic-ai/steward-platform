{{- /* Keep the generated password across upgrades. */ -}}
{{- $password := randAlphaNum 32 }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.name }}
{{- if and $existing (hasKey ($existing.data | default dict) "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}
  labels:
    app.kubernetes.io/name: postgresql-evaluation
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  password: {{ $password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.stewardDatabaseSecret.name }}
  labels:
    app.kubernetes.io/name: postgresql-evaluation
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{ .Values.stewardDatabaseSecret.key }}: {{ printf "postgres://%s:%s@%s.%s.svc.%s:%d/%s?sslmode=disable" .Values.user $password .Values.name .Release.Namespace .Values.clusterDomain (int .Values.port) .Values.database | quote }}
